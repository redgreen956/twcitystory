x-large-font-size{font-size: var(--wp--preset--font-size--xx-large) !important;}.wp-block-image.has-body-font-family{font-family: var(--wp--preset--font-family--body) !important;}.wp-block-image.has-heading-font-family{font-family: var(--wp--preset--font-family--heading) !important;}.wp-block-image.has-system-serif-font-family{font-family: var(--wp--preset--font-family--system-serif) !important;}.wp-block-image.has-system-sans-serif-font-family{font-family: var(--wp--preset--font-family--system-sans-serif) !important;}/* 1. 鎖定網格內的「單一文章」作為獨立卡片基準 */
.film-card li,
.film-card .wp-block-post {
  position: relative !important;
  overflow: hidden;
}

/* 2. 只有當滑鼠停在「單一文章」時，該文章的圖片才變暗 */
.film-card li img,
.film-card .wp-block-post img {
  transition: filter 0.6s ease !important;
}
.film-card li:hover img,
.film-card .wp-block-post:hover img {
  filter: brightness(40%) !important;
}

/* 3. 文字遮罩：精準定位在「單一文章」正中央 */
.film-card .film-overlay {
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  transform: translate(-50%, -50%) !important;
  width: 85% !important;
  text-align: center !important;
  z-index: 10 !important;
  pointer-events: none !important;

  /* 平時隱藏 */
  opacity: 0 !important;
  transition: opacity 0.3s ease !important;
}

/* 4. 強制將標題與超連結文字改為純白色 */
.film-card .film-overlay,
.film-card .film-overlay *,
.film-card .film-overlay a {
  color: #ffffff !important;
  text-decoration: none !important;
}

/* 5. 只有當滑鼠停在「單一文章」時，該文章的文字才淡入 */
.film-card li:hover .film-overlay,
.film-card .wp-block-post:hover .film-overlay {
  opacity: 1 !important;
}
